<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <title>DuckEmu</title>

    <link rel="stylesheet" th:href="@{/css/style.css}"/>

<nav>

    <ul class="nav-links">
        <li>
